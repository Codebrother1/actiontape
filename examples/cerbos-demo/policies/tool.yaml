apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "tool"
  rules:
    # COAZ-MCP default mapping: every MCP tools/call arrives as
    # action "tools/call" on resource kind "tool", with the tool name as
    # the resource id. Read-style tools are allowed; everything else
    # (write_file, edit_file, move_file, ...) is denied by default.
    - actions:
        - "tools/call"
      effect: EFFECT_ALLOW
      roles:
        - "*"
      condition:
        match:
          expr: |
            R.id in [
              "read_file",
              "read_text_file",
              "read_media_file",
              "read_multiple_files",
              "list_directory",
              "list_directory_with_sizes",
              "directory_tree",
              "search_files",
              "get_file_info",
              "list_allowed_directories",
              "get_weather",
            ]
